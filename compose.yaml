services:
  home:
    image: xbaimu-home:local
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - home-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/.next/cache:size=32m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  home-data:
